</head><body><script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { montarCarro } from './modelo.js';
const carro = montarCarro();

new GLTFExporter().parse(carro, buf => {
  const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));

}, e => { window.__erro = String(e); window.__pronto = true; }, { binary: true });
